[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ela"
version = "1.0.0"
description = "Electrical load analysis for aircraft power systems, after MIL-E-7016F."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
]

[project.scripts]
ela = "ela.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "pytest-playwright>=0.6",
  "ruff>=0.7",
]

[tool.setuptools]
packages = ["ela"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "tc(*ids): test case IDs from docs/test-cases.md that this test implements",
  "e2e: browser test driven by Playwright",
  "meta: test that runs the rest of the suite in a subprocess",
]

[tool.ruff]
line-length = 100
target-version = "py312"
